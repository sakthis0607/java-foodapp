<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Ordering App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: linear-gradient(90deg, #ff5722, #ff9800);
            padding: 25px;
            text-align: center;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            text-align: center;
        }

        .btn {
            padding: 15px 35px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e64a19;
        }
    </style>
</head>

<body>

<header>
    <h1>🍔 Food Ordering Application</h1>
    <p>Order your favorite food online</p>
</header>

<div class="container">
    <h2>Welcome!</h2>
    <a href="/foods" class="btn">View Food Items</a>
</div>
